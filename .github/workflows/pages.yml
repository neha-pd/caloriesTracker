name: Publish Fitkin website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set social image URL for this repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          owner, repo = os.environ['REPOSITORY'].split('/')
          page = Path('website/index.html')
          page.write_text(page.read_text().replace('https://neha-pd.github.io/caloriesTracker/assets/kin.png', f'https://{owner}.github.io/{repo}/assets/kin.png'))
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
